<svg width="1120" height="250" viewBox="0 0 1120 250" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.6" /></marker></defs><g key="0"><rect x="0" y="0" width="320" height="160" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.8" /><text x="160" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565C0" font-family="Microsoft YaHei">第一代 · 参数化/模板化</text><text key="0" x="160" y="64" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">尺寸驱动几何与网格</text><text key="1" x="160" y="88" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">确定性强、可复现</text><text x="160" y="140" text-anchor="middle" font-size="12" fill="#B91C1C" font-family="Microsoft YaHei">局限：覆盖窄 · 维护贵 · 门槛高</text><line x1="324" y1="80" x2="356" y2="80" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar1)" /></g><g key="1"><rect x="380" y="0" width="320" height="160" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8" /><text x="540" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E7D32" font-family="Microsoft YaHei">第二代 · 脚本化自动化</text><text key="0" x="540" y="64" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">脚本驱动前处理与批处理</text><text key="1" x="540" y="88" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">可复现、可批量化</text><text x="540" y="140" text-anchor="middle" font-size="12" fill="#B91C1C" font-family="Microsoft YaHei">局限：要双技能 · 缺语义</text><line x1="704" y1="80" x2="736" y2="80" stroke="#64748B" stroke-width="1.8" marker-end="url(#ar1)" /></g><g key="2"><rect x="760" y="0" width="320" height="160" rx="10" fill="#FFF3E0" stroke="#E65100" stroke-width="1.8" /><text x="920" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#E65100" font-family="Microsoft YaHei">第三代 · 大模型生成</text><text key="0" x="920" y="64" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">自然语言 → 结构化意图</text><text key="1" x="920" y="88" text-anchor="middle" font-size="13" fill="#1A1A1A" font-family="Microsoft YaHei">交互自然、可编排</text><text x="920" y="140" text-anchor="middle" font-size="12" fill="#B91C1C" font-family="Microsoft YaHei">局限：输出不确定 · 须独立验证</text></g><rect x="0" y="190" width="1080" height="48" rx="8" fill="#F1F5F9" /><text x="24" y="221" font-size="14" fill="#0D47A1" font-family="Microsoft YaHei">本框架定位：继承第二代的确定性与可复现，补上第三代的自然交互，并用「契约 + 验证闸」消除第三代的不确定性</text></svg>