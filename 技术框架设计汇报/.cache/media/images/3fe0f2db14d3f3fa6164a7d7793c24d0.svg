<svg width="560" height="330" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg"><text x="0" y="18" font-size="14" fill="#64748B" font-family="Microsoft YaHei">传统人工流程</text><g key="0"><rect x="0" y="30" width="92" height="58" fill="#90CAF9" stroke="#FFFFFF" stroke-width="2" /><text x="46" y="56" text-anchor="middle" font-size="12" fill="#0D47A1" font-family="Microsoft YaHei">几何简化</text><text x="46" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#0D47A1" font-family="Microsoft YaHei">18%</text></g><g key="1"><rect x="92" y="30" width="164" height="58" fill="#1565C0" stroke="#FFFFFF" stroke-width="2" /><text x="174" y="56" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei">网格与属性</text><text x="174" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">32%</text></g><g key="2"><rect x="256" y="30" width="102" height="58" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2" /><text x="307" y="56" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei">载荷边界</text><text x="307" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">20%</text></g><g key="3"><rect x="358" y="30" width="102" height="58" fill="#B0BEC5" stroke="#FFFFFF" stroke-width="2" /><text x="409" y="56" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Microsoft YaHei">求解后处理</text><text x="409" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A" font-family="Microsoft YaHei">20%</text></g><g key="4"><rect x="460" y="30" width="51" height="58" fill="#CFD8DC" stroke="#FFFFFF" stroke-width="2" /><text x="485.5" y="56" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Microsoft YaHei">报告</text><text x="485.5" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A" font-family="Microsoft YaHei">10%</text></g><text x="0" y="138" font-size="14" fill="#64748B" font-family="Microsoft YaHei">智能生成后（目标）</text><g key="0"><rect x="0" y="150" width="255" height="58" fill="#00897B" stroke="#FFFFFF" stroke-width="2" /><text x="127.5" y="176" text-anchor="middle" font-size="12" fill="#FFFFFF" font-family="Microsoft YaHei">规则化劳动 → 自动</text><text x="127.5" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Microsoft YaHei">50%</text></g><g key="1"><rect x="255" y="150" width="77" height="58" fill="#4DB6AC" stroke="#FFFFFF" stroke-width="2" /><text x="293.5" y="176" text-anchor="middle" font-size="12" fill="#004D40" font-family="Microsoft YaHei">工程师判断</text><text x="293.5" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#004D40" font-family="Microsoft YaHei">15%</text></g><g key="2"><rect x="332" y="150" width="102" height="58" fill="#B0BEC5" stroke="#FFFFFF" stroke-width="2" /><text x="383" y="176" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Microsoft YaHei">求解后处理</text><text x="383" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A" font-family="Microsoft YaHei">20%</text></g><g key="3"><rect x="434" y="150" width="77" height="58" fill="#CFD8DC" stroke="#FFFFFF" stroke-width="2" /><text x="472.5" y="176" text-anchor="middle" font-size="12" fill="#1A1A1A" font-family="Microsoft YaHei">报告</text><text x="472.5" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1A1A1A" font-family="Microsoft YaHei">15%</text></g><line x1="0" y1="250" x2="511" y2="250" stroke="#E2E8F0" stroke-width="1" /><text x="0" y="282" font-size="14" fill="#B91C1C" font-weight="bold" font-family="Microsoft YaHei">建模约占 60%–80% 工时，其中过半是可规则化的重复劳动</text><text x="0" y="308" font-size="13" fill="#64748B" font-family="Microsoft YaHei">切入点不是替代工程师判断，而是把七成劳动自动化</text></svg>